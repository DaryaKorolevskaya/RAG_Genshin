services:
  qdrant:
    image: qdrant/qdrant:v1.17.1   # версия под qdrant-client из uv.lock
    ports: ["6333:6333"]           # http://localhost:6333/dashboard — веб-интерфейс базы
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rag:                             # RAG-сервис: эмбеддинги, поиск, LangGraph, LLM, история диалогов
    build: { context: ., dockerfile: services/rag/Dockerfile }
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data           # корпус, PDF, кэш моделей, история диалогов (SQLite)
    ports: ["8000:8000"]
    depends_on: [qdrant]
    restart: unless-stopped

  bot:                             # тонкий клиент к rag
    build: { context: ., dockerfile: services/bot/Dockerfile }
    env_file: .env
    environment:
      RAG_API_URL: http://rag:8000
    depends_on: [rag]
    restart: unless-stopped

  web:                             # фронтенд: статика + прокси /api → rag
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [rag]
    restart: unless-stopped

volumes:
  qdrant_data:
