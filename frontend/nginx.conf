server {
    listen 80;
    root /usr/share/nginx/html;

    # API проксируем на RAG-сервис: фронтенд и API на одном домене, CORS не нужен
    location /api/ {
        proxy_pass http://rag:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;          # иначе nginx копит стрим и ответ приходит одним куском
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
